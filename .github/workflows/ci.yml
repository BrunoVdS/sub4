name: Build and test

# Plan step 1.2.6–1.2.8. Debug and Release from a clean checkout, unit tests on
# every push, and a coverage report as information rather than as a threshold.
#
# THE RUNNER IMAGE IS THE WHOLE PROBLEM, AND IT TOOK THREE RUNS TO LEARN IT
# ------------------------------------------------------------------------
# `macos-15` carries Xcode 26 bundles, which made it look usable. It does not
# carry the iOS 26 simulator RUNTIME — those images ship iOS 18 runtimes for the
# Xcode 16 line. Selecting Xcode 26.3 there produced a toolchain with no iPhone
# destinations whatsoever: the available list was two placeholders and five
# Apple Vision Pro simulators. xcodebuild also reported that Xcode 26.3 does not
# support the image's own macOS 15.7.7.
#
# `macos-26` pairs the OS, the Xcode and the iOS runtime that belong together.
# The alternative — staying on macos-15 and running `xcodebuild
# -downloadPlatform iOS` — works and costs several gigabytes and roughly ten
# minutes of a 200-minute monthly budget on every single run. Not worth it to
# avoid changing one line.
#
# NOTHING IS ASSUMED ABOUT THE IMAGE ANY MORE. The Xcode bundle is globbed and
# version-sorted, the simulator is discovered by UDID at run time, and both
# steps EXIT with the full available list rather than warning and carrying on.
# Every guess in the first three versions of this file — that `Xcode_26.app`
# existed, that `xcbeautify` was installed, that an `iPhone 16 Pro` simulator
# was present — was wrong, and each one cost a run to disprove.
#
# COST, AND WHY THIS FILE IS SHAPED THE WAY IT IS
# -----------------------------------------------
# macOS runners bill at 10× against the free monthly minutes: 2,000 included
# minutes are 200 macOS minutes. The allowance was exhausted in early August
# 2026, which is what prompted the following four changes.
#
#   1. NOT ON EVERY PUSH — the change that actually mattered.
#
#      Measured from the billing page: 3 August 2026 cost 193.55 macOS minutes
#      across 21 successful runs. Wall-clock was ~109 minutes; billing was 1.78×
#      that, because two parallel jobs each bill their own time while the run's
#      duration only shows the longer one. A push therefore costs about 8.7
#      billed minutes, and 200 minutes a month is ~23 pushes.
#
#      Ten pushes in a working day is normal on this project. Push-triggered CI
#      on macOS was never compatible with the free tier — no amount of tuning
#      closes a gap that large.
#
#      So: weekly, on tags, and on demand. That is ~4 runs a month against an
#      allowance of ~23, and it keeps the two things CI gives that a local
#      `xcodebuild test` does not — proof that a clean checkout builds, and
#      proof that the Release configuration compiles.
#
#      The cost, stated: a clean-checkout break can now sit undetected for up
#      to six days. Acceptable only because the thing that breaks daily —
#      regressions — is caught by the local suite, which is run before every
#      patch on this project. It would not be acceptable on a team.
#
#   2. ONE JOB, NOT TWO. Debug tests and the Release build were separate jobs.
#      They ran in parallel, which looked faster and cost more: each paid
#      separately for checkout, Xcode selection and GRDB resolution. Merging
#      saves that duplicated setup — about 1.5–2 minutes, so roughly 20% of a
#      push, not the half it first appeared to be. The Release build still
#      costs what it costs.
#
#      The consequence, stated: a failing test now hides a Release-only
#      compile error until the tests pass. That is the right trade while
#      minutes are the constraint, and it is the first thing to revert when
#      they are not.
#
#   3. TIMEOUT 40 → 20. A hung job at 40 minutes bills 400 — twice the monthly
#      allowance, from one stuck run. Real runs finish in a few minutes; 20 is
#      already generous and it caps the disaster.
#
#   4. `paths-ignore` KEPT ON THE TAG TRIGGER's SIBLINGS. Documentation-only
#      changes never justified a macOS runner.
#
#   5. COVERAGE ON DEMAND. Instrumenting every run to produce a number this
#      file itself calls "information, not a gate" is build time and artifact
#      storage spent on something nobody reads most weeks. It now runs on
#      `workflow_dispatch`, where somebody has actually asked for it.
#
# WHAT IS DELIBERATELY NOT DONE: the Swift package cache is not restored. It
# would save perhaps forty seconds a run and it would also stop this workflow
# from proving that a clean checkout can still resolve GRDB from the internet —
# which is the one thing an exactly-pinned dependency needs checking, and the
# acceptance criterion for plan step 1.1.

on:
  # Monday morning. Late enough that a Sunday evening push is included, early
  # enough that the answer is waiting rather than arriving mid-week.
  schedule:
    - cron: '0 6 * * 1'

  # A tag is the one push that is worth a run on its own: it is the commit
  # somebody intends to keep.
  push:
    tags: ['v*']

  # And whenever it is actually wanted — before a long session, after a
  # dependency change, or when something feels wrong.
  workflow_dispatch:
    inputs:
      coverage:
        description: 'Instrument and report code coverage'
        type: boolean
        default: true
    inputs:
      coverage:
        description: 'Instrument and report code coverage'
        type: boolean
        default: true

concurrency:
  # Kept although pushes no longer trigger this: two manual runs started in
  # quick succession are the same mistake, and the later one is the one meant.
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Sub4
  PROJECT: Sub4.xcodeproj

jobs:
  build:
    name: Debug tests and Release build
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      # BEFORE the inventory, not after — the previous version had these the
      # wrong way round and dutifully printed the simulator list belonging to a
      # toolchain it was about to stop using.
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "::error::No Xcode 26 on this runner. Available:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "selecting $XC"
          sudo xcode-select -switch "$XC"

      - name: Inventory
        run: |
          echo "=== selected toolchain ==="
          xcodebuild -version
          swift --version
          echo "=== iOS SDKs ==="
          xcodebuild -showsdks | grep -i ios || true
          echo "=== simulator runtimes ==="
          xcrun simctl list runtimes || true
          echo "=== available iPhone simulators ==="
          xcrun simctl list devices available | grep -i iphone || echo "(none)"

      # ASK XCODEBUILD, NOT SIMCTL — and this distinction cost a run.
      #
      # `simctl list devices available` enumerates every device on every
      # installed runtime and knows nothing about this project. The image
      # carries iOS 26.2, 26.4 and 26.5, so there are THREE devices named
      # "iPhone 17 Pro"; `head -1` took the one on 26.2, which a deployment
      # target of 26.5 makes ineligible. xcodebuild then reported it could not
      # find the destination — while listing an iPhone 17 Pro of its own, with a
      # different UDID, two lines further down.
      #
      # `-showdestinations` is xcodebuild's own answer for THIS scheme, with
      # eligibility already applied. It cannot disagree with the build that
      # follows it, which is the entire point.
      #
      # arm64 only: each simulator appears twice, once per architecture, and
      # taking both would make `head -1` a coin toss.
      - name: Choose a simulator
        id: sim
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showdestinations 2>/dev/null \
            | tee /tmp/destinations.txt >/dev/null
          UDID=$(grep 'platform:iOS Simulator' /tmp/destinations.txt \
                 | grep 'arch:arm64' \
                 | grep 'name:iPhone' \
                 | head -1 \
                 | grep -oE 'id:[0-9A-F-]{36}' | cut -d: -f2)
          if [ -z "$UDID" ]; then
            echo "::error::No eligible iPhone simulator for this scheme. xcodebuild offers:"
            cat /tmp/destinations.txt
            exit 1
          fi
          echo "chosen destination:"
          grep "$UDID" /tmp/destinations.txt | head -1
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # A clean clone must build without relying on anything untracked. That is
      # the acceptance criterion for plan step 1.1, and this enforces it from
      # here on rather than by a one-off manual check.
      #
      # Coverage is off unless asked for — see the cost note in the header.
      - name: Build and test
        run: |
          set -o pipefail
          COVERAGE=NO
          RESULTS=()
          if [ "${{ github.event.inputs.coverage }}" = "true" ]; then
            COVERAGE=YES
            RESULTS=(-resultBundlePath TestResults.xcresult)
          fi
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -enableCodeCoverage "$COVERAGE" \
            "${RESULTS[@]}" \
            CODE_SIGNING_ALLOWED=NO

      # Release is built as well as Debug because they are different
      # compilations: optimisation changes what the type-checker will accept in
      # reasonable time, and `#if DEBUG` changes what code exists at all — in
      # this project that flag decides whether the release gates can be opened.
      # A Debug-only CI would never compile the branch that actually ships.
      #
      # Same job as the tests since August 2026 — see cost note 1.
      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      # Information, not a gate — step 1.2.8. A global percentage threshold on a
      # codebase that is mostly view code would fail every honest commit and
      # teach everyone to ignore it. What matters is that each fixed defect
      # gains a test, which is a review question rather than a number.
      - name: Coverage summary
        if: always() && github.event.inputs.coverage == 'true'
        run: xcrun xccov view --report --only-targets TestResults.xcresult || true

      - name: Upload results
        if: always() && github.event.inputs.coverage == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 14
